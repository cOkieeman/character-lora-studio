schema_version: 3
character_id: "{{CHARACTER_ID}}"
display_name: "{{DISPLAY_NAME}}"
trigger: "{{TRIGGER}}"
trigger_confirmed: false
concept:
  type: {{CONCEPT_TYPE}}
  outfit_trigger: ""

# Used only for concept.type=cast (Krea 2); the root trigger stays empty.
cast:
  characters: []  # Each: id, trigger, class_noun, references, fixed, controllable, variable, forbidden_drift.
  important_pairs: []
  fixed_duo: false
  project_manifest: ""  # Image paths relative to project root; approved training members only.
  export_manifests: []  # Per frozen export: version, dataset_path, manifest_path.

# Publishing provenance. Unknown is intentional; never infer ownership from a name.
character_source:
  type: unknown  # original, fan, authorized, unknown, not_applicable
  work: ""
  creator: ""
  rights_holder: ""
  evidence: []  # Reviewed project-relative records or public source references.
  authorization:
    status: unknown  # unknown, none, confirmed
    provider: ""
    scope: ""
    evidence: []

publication:
  template: model-publishing-template-v1
  copyright_notice_mode: auto
  releases: []  # Per-family/version facts and licenses; see references/publishing.md.

target_platforms: []
base_models:
  anima: ""
  krea2_train: "Krea-2-Raw"
  krea2_test: "Krea-2-Turbo"

hardware:
  gpu_name: ""
  vram_gb: 0
  ram_gb: 0
  storage_free_gb: 0

forms:
  human:
    enabled: true
    caption_prefix: "{{ANIMA_PREFIX}}"
  alternate:
    enabled: false
    separate_lora: true
    tag: ""

identity:
  fixed: []
  controllable: []
  variable: []
  forbidden_drift: []

outfit_identity:
  fixed: []
  controllable: []
  variable_wearer: []
  forbidden_drift: []

outfits:
  default:
    name: ""
    target_images: 0
    tags: []
  variants: []

caption_profiles:
  anima:
    enabled: false
    language: en
    style: booru_tags
    prefix: "{{ANIMA_PREFIX}}"
    remove_tags:
      - newest
      - safe
      - masterpiece
      - best quality
  krea2:
    enabled: false
    language: en
    style: natural_language
    trigger_pattern: "{{TRIGGER}}"
    max_tokens: 512

training_profiles:
  anima:
    configured: false
    studio_version: ""
  krea2:
    configured: false
    studio_version: ""
    transformer_variant: raw_fp8
    text_encoder_variant: fp8
    blocks_to_swap: 0
    smoke_test_steps: 10

regularization:
  enabled: false
  target_images: 0
  forbidden_tags: {{TRIGGER_LIST}}
  forbidden_concepts: []

notes: []

# Project-specific targets. Null means undecided, never zero approved by implication.
dataset_plan:
  candidate_minimum: null
  approved_target: null
  packs: []
  # Each pack: id, purpose, candidate_target, approved_target, background_policy,
  # allowed_styles, fixed_features, variable_features. Counts are not universal defaults.
  generation_provider: ""
  generation_model: ""  # Keep unknown if the built-in tool does not expose its model.
  reference_roles: []  # Each: file, role(s), character_id (for cast), approved_scope.
  batch_size: null
  horizontal_flip: false
  hub_project_id: ""
  hub_dataset_id: ""

training_plan:
  family_order: []
  stages: []
  # Each stage: id, family, packs, parent_run_id, resume_mode,
  # effective_sampling_weights, frozen_dataset_manifest, caption_manifest.
  # Resume modes: fresh, weights_only, full_state (same-run recovery).

review_policy:
  primary_reviewer: ""  # plugin, hub, or user; all can curate and caption.
  hub_second_review: optional  # optional or required, chosen by the user.
